#
# go — archetype for a Go CLI application (dotty, evolve, gh-claude).
#
# Include AFTER common/tasks.toml in the consumer's root mise.toml:
#   [task_config]
#   includes = [".mise/common/tasks.toml", ".mise/archetypes/go/tasks.toml"]
#
# Required root [tools] pins — the library pins neither, so each repo tracks
# its own Go at its own cadence:
#   go = "1.27.1"
#   "go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"   # go install'ed by that Go
# govulncheck must be compiled by the same Go the repo builds with, which is
# why it rides with the go pin rather than the shared config. golangci-lint,
# gotestsum, goreleaser and syft come from the shared pins (prebuilt
# binaries); override golangci-lint in root [tools] if the repo's Go outpaces
# it.
#
# Structural knobs come from [vars] in the consumer's root mise.toml (app,
# app_pkg, build_tags, version_pkg); per-invocation values (VERSION, COMMIT,
# DATE, LDFLAGS, MODULE, FUZZ, FUZZTIME, FUZZ_PKG) are environment variables
# with defaults computed inside the scripts — `make build VERSION=x` still
# works because make exports command-line variables to recipe subshells, and
# the go knobs also accept env (`make build APP=x`) for muscle-memory parity.
#
# `docs` is intentionally left to the repo — regenerating a CLI reference is
# app-specific (`./<app> docs …`). A repo defines a `docs` task in its root
# mise.toml [tasks] and appends it to the gate (`pr: docs` in its Makefile, or
# a redefined `pr` task). `serve`, `docs-build`, and `sync` (zensical via the
# shared uv pin) come ready-made, so a Go repo with a docs site includes only
# this archetype. No `e2e` here: the reusable CI's e2e job is opt-in and no Go
# repo opts in; a repo that does defines its own e2e task.

[tidy]
description = "tidy the go module graph"
dir = "{{cwd}}"
run = ["rm -f go.sum", "go mod tidy"]

# Auto-fix pass wired into the `fmt` rollup.
[go-fmt]
hide = true
dir = "{{cwd}}"
run = ["go fmt ./...", "golangci-lint run --fix"]

# Check-mode pass wired into the `lint` rollup. govulncheck stays here (not
# only in CI) so the local lint gate and the CI gate check the same things.
[go-lint]
hide = true
dir = "{{cwd}}"
run = ["golangci-lint run", "govulncheck ./..."]

# gotestsum + race detector + coverage profile → coverage/ (see scripts/test.sh).
[go-test]
hide = true
dir = "{{cwd}}"
run = "{{config_root}}/.mise/archetypes/go/scripts/test.sh"

# Version metadata stamped into the binary via -ldflags (see scripts/build.sh).
# The knob defaults reach the script as TOOLCHAIN_* so the plain APP/APP_PKG/…
# spellings stay free for per-invocation env overrides.
[go-build]
hide = true
dir = "{{cwd}}"
env = { TOOLCHAIN_APP = "{{vars.app}}", TOOLCHAIN_APP_PKG = "{{vars.app_pkg}}", TOOLCHAIN_BUILD_TAGS = "{{vars.build_tags}}", TOOLCHAIN_VERSION_PKG = "{{vars.version_pkg}}" }
run = "{{config_root}}/.mise/archetypes/go/scripts/build.sh"

# --skip=sign: cosign keyless signing needs the GitHub Actions OIDC token, so it
# only works in the release workflow — locally it would fail or prompt.
# --skip=notarize: a repo with a notarize.macos block enables it whenever
# MACOS_SIGN_P12 is exported, so a developer who has the org's signing material
# in their shell does not Developer ID-sign and notarize a throwaway snapshot by
# accident (run goreleaser by hand for a deliberate end-to-end test).
# GoReleaser shells out to syft for SBOMs; syft is on PATH via the pins.
[snapshot]
description = "build a local release snapshot (binaries + archives, no publish, signing, or notarization)"
dir = "{{cwd}}"
run = "goreleaser release --snapshot --clean --skip=sign,notarize"

[release]
description = "build and publish a release (needs a vX.Y.Z tag + creds)"
dir = "{{cwd}}"
run = "goreleaser release --clean"

# `go test -fuzz` accepts a single package only, so FUZZ_PKG must name one.
[fuzz]
description = "fuzz one target (FUZZ=FuzzName FUZZTIME=20s FUZZ_PKG=./pkg)"
dir = "{{cwd}}"
run = "{{config_root}}/.mise/archetypes/go/scripts/fuzz.sh"

# Zensical documentation site (Python via uv). `uv sync` provisions Python +
# zensical from pyproject.toml; the built site/ is git-ignored.
[sync]
hide = true
dir = "{{cwd}}"
run = "uv sync"

[docs-build]
description = "build the documentation site (zensical)"
dir = "{{cwd}}"
depends = ["sync"]
run = "uv run zensical build"

[serve]
description = "serve the docs site locally (zensical)"
dir = "{{cwd}}"
depends = ["sync"]
run = "uv run zensical serve"

# Canonical contract: sequential composites preserve the old serial-make
# ordering (fmt before lint; mutating passes never race).
[fmt]
description = "format go + prose, inject license headers"
run = [{ task = "go-fmt" }, { task = "fmt-prose" }, { task = "license" }]

[lint]
description = "all check-mode static analysis"
run = [
  { task = "license-check" },
  { task = "go-lint" },
  { task = "lint-containers" },
  { task = "lint-shell" },
  { task = "lint-workflows" },
  { task = "lint-prose" },
]

[build]
description = "build the application binary"
run = [{ task = "go-build" }]

[test]
description = "run the unit tests with coverage"
run = [{ task = "go-test" }]

[ci]
description = "the gates the reusable CI workflow runs"
run = [{ task = "lint" }, { task = "test" }, { task = "build" }]

[pr]
description = "full local gate before a pull request"
run = [
  { task = "tidy" },
  { task = "fmt" },
  { task = "lint" },
  { task = "test" },
  { task = "build" },
  { task = "commit" },
]
