# Daily cooldown updater for the developer CLIs in config.toml: every [tools]
# entry floats on "latest" (node on "lts") and the real pin lives in mise.lock,
# so the reusable workflow's `mise lock --bump` advances the lockfile only --
# config.toml is never modified. This repo IS the shared task library, so its
# root mise.lock (reached through the .mise/mise.lock dogfood symlink) is the
# fleet's lockfile: bumps that merge here propagate to consumers via their
# .mise/ submodule. Human-reviewed by design; the PR is not auto-merged.
#
# TODO: re-pin `uses:` to the release SHA once github-workflows ships the
# reusable update-tools workflow (it is not in v6.0.2 or earlier).
name: Update Tools

on:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC
  workflow_dispatch:
    inputs:
      cooldown-days:
        description: Minimum age (days) a release must have before it is adopted.
        required: false
        default: "7"

# one updater at a time; a fresh run supersedes a stale one
concurrency:
  group: update-tools
  cancel-in-progress: true

# ceiling for the reusable workflow's update job
permissions:
  # push the update branch
  contents: write
  # open/update the pull request
  pull-requests: write

jobs:
  update:
    uses: bitwise-media-group/github-workflows/.github/workflows/update-tools.yaml@main
    with:
      cooldown-days: ${{ github.event.inputs.cooldown-days || '7' }}
