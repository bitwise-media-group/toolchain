# Thin caller for the reusable renovate workflow. It runs the org's self-hosted
# Renovate bot — same "Renovate" App, same bot-side config and org preset from
# bitwise-media-group/renovate-config — against this repository only, on its own
# schedule, layering .github/renovate.json5 on top of the preset. The org-wide
# loop (renovate-config's renovate-org.yaml) is now dispatch-only, so the two
# never race on branches or automerge.
#
# Triggers:
#   schedule          — hourly, off the congested top of the hour. Renovate
#                       automerges at most one PR per base branch per run, so the
#                       cron is also the merge throughput for a queue of green PRs.
#   workflow_dispatch — a manual run; `dry-run: full` + `log-level: debug` logs
#                       what Renovate would do without writing anything.
#   issues [edited]   — a checkbox tick in the Dependency Dashboard issue runs
#                       Renovate now instead of at the next tick.
#   pull_request      — same for the checkboxes in a Renovate PR body
#     [edited]          (rebase/retry). Edits to other issues/PRs skip the job.
#   workflow_run      — a required workflow finished green on a renovate/* PR:
#     [completed]       the PR just became mergeable, so Renovate runs now
#                       instead of at the next tick.
#   push [main]       — main moved, usually by Renovate's own merge. A run merges
#                       at most two PRs, so each merge's push starts the next run
#                       and the queue of green PRs drains without the cron.
# Neither checks out or runs PR code.
#
# Org prerequisites: the "Renovate" App installed on this repo, exposed as the
# RENOVATE_CLIENT_ID variable + RENOVATE_PRIVATE_KEY secret.
#
# Pinned to a full commit SHA (tag in the comment); Renovate keeps it fresh.
name: Renovate

on: # zizmor: ignore[dangerous-triggers] -- workflow_run only starts a Renovate run; no PR code is checked out or run
  schedule:
    - cron: "24 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry-run mode: empty (live), "extract", "lookup", or "full".'
        required: false
        default: ""
        type: string
      log-level:
        description: Renovate log level.
        required: false
        default: info
        type: choice
        options:
          - info
          - debug
  issues:
    types: [edited]
  pull_request:
    types: [edited]
  workflow_run:
    workflows:
      - "Continuous Integration"
      - "Security Analysis"
    types: [completed]
    branches: ["renovate/**"]
  push:
    branches: [main]

# the App token does the privileged work; the caller grants nothing
permissions: {}

jobs:
  renovate:
    uses: bitwise-media-group/github-workflows/.github/workflows/renovate.yaml@67215effe1e541e699905fb62b7a48b7293f935c # v8.3.0
    with:
      app-client-id: ${{ vars.RENOVATE_CLIENT_ID }}
      dry-run: ${{ inputs.dry-run || '' }}
      log-level: ${{ inputs.log-level || 'info' }}
    secrets:
      app-private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
