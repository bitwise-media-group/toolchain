# The toolchain library dogfoods its own tasks: common plus the python
# archetype, which builds the documentation site. This thin caller runs the
# reusable CI (v5+: mise-task aware), which discovers the canonical tasks the
# repo defines via `mise tasks ls --name-only` and runs `make <target>` for
# each: `lint` (addlicense + prettier + markdownlint, the actionlint + zizmor
# workflow lint, and shellcheck over the library's own task scripts; ruff is
# skipped, it isn't a project dependency), `build` (zensical renders the docs
# site, so a broken page fails the PR) and `test` (pytest isn't a project
# dependency either, so it skips with a message). The pinned tooling installs
# via mise from the repo-root config.toml (the file consumers load as
# .mise/config.toml) and .mise/mise.lock; the reusable workflow's Setup mise
# step puts a pinned mise on PATH.
#
# Pinned to a full commit SHA (tag in the comment); Renovate keeps it fresh.
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: ["main", "releases/*"]

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
  contents: read

jobs:
  ci:
    uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@437369afd3c617ae0cd06085e281574c7eb560a2 # v8.0.1
    with:
      # no unit tests here (the test task skips: pytest is not a dependency), so
      # skip the Codecov upload
      coverage: false
