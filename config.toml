#
# The fleet's shared mise config: pinned developer CLIs and knob defaults.
# Consumer repos mount this library as a git submodule at `.mise/`, so mise
# loads this file natively as `.mise/config.toml` — no per-repo tool setup, no
# symlinks. The consumer's own root mise.toml layers on top (higher
# precedence): it pins the repo's primary language runtime in [tools], picks
# the task files via
#   [task_config] includes = [".mise/common/tasks.toml", ".mise/archetypes/<lang>/tasks.toml"]
# (common first, then exactly one archetype), overrides [vars], and adds
# repo-local tasks. The tasks themselves live in common/tasks.toml (shared by
# every archetype) and archetypes/<lang>/tasks.toml — never here.
#
# IMPORTANT: this file must never contain [task_config] — its include paths
# would resolve against each consumer's repo root and break. Archetype
# selection always lives in the consumer's root mise.toml (this repo's own
# .config/mise.toml dogfoods the same way).
#
# Language runtimes are NOT pinned here (bun aside, below). go, python, node
# and swift are per-repo concerns so each repo can track its own version at its
# own cadence: a Go repo pins `go` (and govulncheck, below) in its root
# [tools], an npm or pnpm Node repo pins `node` (the library provides none; a
# bun repo pins nothing and runs on the shared bun), a Swift repo pins `swift`
# (swift format and llvm-cov ship in that toolchain), and a Python repo lets uv
# provision Python from .python-version / requires-python (or pins `python`
# itself). Each repo's own Renovate bumps those pins.
#
# bun IS always installed here: every repo must be able to format and lint
# prose without a package.json or a Node.js install. `bun fmt` (bun's
# built-in, Prettier-compatible formatter) formats the markdown natively. The
# one npm-backed prose tool left, markdownlint-cli2, is installed by aube, but
# its shim `exec`s node: common/scripts/prose.sh puts common/bin/ first on
# PATH, whose `node` is a wrapper that execs bun, so it runs on bun too. The
# wrapper is scoped to prose.sh alone: it never shadows a Node repo's own
# `node` pin anywhere else. The same pin is the runtime, package manager,
# formatter, type checker, bundler and test runner of the node archetype's bun
# repos, which therefore pin no runtime of their own.
#
# govulncheck is deliberately absent: it publishes no binaries and must be
# `go install`ed by the same Go the repo builds with, so every Go repo pins
# "go:golang.org/x/vuln/cmd/govulncheck" in its own root [tools] next to `go`.
# The go archetype's lint still runs it, so `mise run lint` and the CI gate
# stay in parity. golangci-lint, gotestsum and goreleaser stay shared: they are
# prebuilt release binaries, not coupled to the repo's Go version — a repo
# whose Go outpaces the shared golangci-lint can override that one pin in its
# root [tools].
#
# Backends are spelled out explicitly (aqua:/github:/npm:) so the trust path
# for each tool is pinned and cannot drift with registry default changes.
# Every tool is a prebuilt release binary: sha256 checksums are locked per
# platform in mise.lock and verified on every install, plus cosign/SLSA/
# GitHub-attestation verification where the publisher provides it (all on by
# default).
#
# markdownlint-cli2 is an npm package with no standalone binary, so it
# installs from the npm registry (npm: backend) via aube and runs on the bun
# pinned below (see above). Its top-level version is pinned exactly here
# (checksums in mise.lock); unlike a package-lock.json, its transitive npm
# dependencies are not pinned (the tree is small). mise forwards
# minimum_release_age into transitive resolution (npm >= 11.10
# --min-release-age), so even transitives can't pull a release younger than
# the cooldown. npm.package_manager is left at its "auto" default: aube is
# embedded in mise, so "auto" resolves to it on every machine and in CI alike,
# and a global config on "auto" agrees with the fleet instead of tripping over
# aube-locked global tools when installing inside a repo.
#
# grype and kubescape pull external data at runtime rather than at install:
# grype fetches its vulnerability database on first use (~200 MB, cached in
# ~/.cache/grype) and kubescape its controls artifacts (~/.kubescape), so the
# first container/deploy lint on a machine needs network. hadolint, helm and
# shellcheck are plain release binaries (helm ships via get.helm.sh rather
# than GitHub releases), checksum-locked like everything else.
#
# fnox, the secrets manager, is a shared lazy pin so any repo can keep its
# secrets in a committed fnox.toml (encrypted values, or references into a
# vault) and run commands with them through `fnox exec`, on the same version
# locally and in CI. Being lazy, it is only downloaded the first time
# something calls `fnox`, so a repo without a fnox.toml never installs it.
# The terraform archetype's tf-run.sh is the one shared caller: it wraps the
# state-touching tasks in `fnox exec` when the module directory carries a
# fnox.toml. A secret fnox can't resolve (a CI job without vault access, say)
# only warns by default (if_missing = "warn") and the command still runs;
# FNOX_IF_MISSING overrides that per job. Plain, non-secret variables need no
# tool at all: they live in the repo's or module's mise.toml [env].
#
# Updates: every [tools] entry is an exact pin, bumped by the org Renovate bot
# (bitwise-media-group/renovate-config) — one PR per tool that updates the pin
# here AND regenerates mise.lock (`mise lock`, the manager's artifact step) in
# the same commit. The release cooldown is Renovate's minimumReleaseAge (3 days
# org-wide, surfaced as the renovate/stability-days check against real release
# timestamps); stable minor/patch bumps automerge, majors and 0.x wait for a
# human. minimum_release_age below no longer gates these bumps — it still
# guards npm transitive resolution. The bot finds this ROOT config.toml via
# .github/renovate.json5 (the dogfood inversion hides it from the mise
# manager's default file patterns). Never run `mise lock` or `mise upgrade` in
# a consumer repo: the lockfile lives in this library, and consumer-side
# writes would land inside the submodule.

[settings]
lockfile = true
locked = false
minimum_release_age = "3d"
# Exempt from the cooldown: our own first-party CLIs (a release we cut should
# roll out immediately, not sit out a supply-chain delay meant for third
# parties) and core:go / core:swift (consumer repos pin them themselves and
# track toolchain security releases promptly). mise has no org-level wildcard —
# "github:bitwise-media-group/*" silently matches nothing — so each
# first-party tool is listed by its full backend ID; add new ones here.
# Consumer repos can append further entries (lists merge across configs).
minimum_release_age_excludes = [
  "core:go",
  "core:swift",
  "github:bitwise-media-group/dotty",
  "github:bitwise-media-group/evolve",
  "github:bitwise-media-group/patchy",
]

# The `--8<--` start/end markers around [tools] and [vars] delimit the
# sections the docs site embeds (docs/reference/); keep new pins inside them.
# --8<-- [start:tools]
[tools]
"core:go" = { version = "1.27.3", lazy = true }
"core:python" = { version = "3.15.2", lazy = true }

"npm:markdownlint-cli2" = "0.24.0"
"aqua:oven-sh/bun" = "1.4.4"

"github:google/addlicense" = "1.2.0"

"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.32.0"
"aqua:anchore/grype" = { version = "0.121.2", lazy = true, lazy_bins = "grype" }
"aqua:anchore/syft" = { version = "1.57.0", lazy = true, lazy_bins = "syft" }
"aqua:astral-sh/uv" = { version = "0.13.7", lazy = true, lazy_bins = "uv" }
"aqua:golangci/golangci-lint" = { version = "2.15.0", lazy = true, lazy_bins = "golangci-lint" }
"aqua:goreleaser/goreleaser" = { version = "2.20.0", lazy = true, lazy_bins = "goreleaser" }
"aqua:gotestyourself/gotestsum" = { version = "1.13.0", lazy = true, lazy_bins = "gotestsum" }
"aqua:hadolint/hadolint" = { version = "2.15.1", lazy = true, lazy_bins = "hadolint" }
"aqua:hashicorp/terraform" = { version = "1.17.1", lazy = true, lazy_bins = "terraform" }
"aqua:helm/helm" = { version = "4.3.1", lazy = true, lazy_bins = "helm" }
"aqua:jdx/fnox" = { version = "1.47.0", lazy = true, lazy_bins = "fnox" }
"aqua:kubescape/kubescape" = { version = "4.0.20", lazy = true, lazy_bins = "kubescape" }
"aqua:pnpm/pnpm" = { version = "12.18.0", lazy = true, lazy_bins = "pnpm" }
"aqua:sigstore/cosign" = { version = "3.1.4", lazy = true, lazy_bins = "cosign" }
"aqua:terraform-docs/terraform-docs" = { version = "0.24.0", lazy = true, lazy_bins = "terraform-docs" }
"aqua:terraform-linters/tflint" = { version = "0.65.0", lazy = true, lazy_bins = "tflint" }
"aqua:docker/buildx" = { version = "0.38.2", postinstall = 'dir="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins" && mkdir -p "$dir" && ln -sf "$MISE_TOOL_INSTALL_PATH/docker-cli-plugin-docker-buildx" "$dir/docker-buildx"' }

# Structural per-repo knobs, referenced as {{vars.name}} in the task files.
# Consumers override them in their root mise.toml [vars] (higher precedence).
# Per-invocation values (VERSION, FUZZ, FUZZTIME, NODE_PACKAGE_MANAGER,
# NODE_INSTALL_FLAGS, ...) are plain environment variables read inside the task
# scripts instead.
# --8<-- [start:vars]
[vars]
# Canonical copyright holder for the whole ecosystem. Do not vary the spelling
# per repo — a single value here is the point. Override only if a repo genuinely
# needs a different holder.
license_holder = "BitWise Media Group Ltd"
# go: output binary (empty = repo directory name) and main package.
app = ""
app_pkg = "."
# go: extra build tags (e.g. an embedded UI: build_tags = "withui").
build_tags = ""
# go: package declaring Version/Commit/BuildDate (empty = <module>/internal/version).
version_pkg = ""
# go: space-separated GOOS list that lint and test cover (e.g. a cross-platform
# CLI: goos = "linux darwin windows"). Empty = the host's GOOS only. Each entry
# gets its own golangci-lint + govulncheck pass; test runs the full suite on the
# host's GOOS and compile-checks the test binaries for every other entry
# (cross-compiled tests cannot execute). GOOS in the environment overrides per
# invocation (`make test GOOS=windows`).
goos = ""
# node: package manager — npm, pnpm or bun. Empty = auto-detect from
# package.json "packageManager", then the lockfile, then npm. Set it when a
# repo carries lockfiles from more than one manager. NODE_PACKAGE_MANAGER in
# the environment overrides per invocation.
node_package_manager = ""
# node: flags for the locked install (npm ci / pnpm install --frozen-lockfile /
# bun install --frozen-lockfile). --ignore-scripts is the safe default for a
# library (npm also always gets --no-fund); a GitHub Action repo that relies on
# lifecycle scripts sets node_install_flags = "" in its root [vars].
# NODE_INSTALL_FLAGS in the environment overrides per invocation (unset-only,
# so NODE_INSTALL_FLAGS= forces a bare install).
node_install_flags = "--ignore-scripts"
# node: npm_ci_flags is the deprecated npm-only spelling of node_install_flags
# and deliberately has no default here. A repo that still sets it (e.g.
# npm_ci_flags = "") gets exactly those flags for `npm ci`, as does
# NPM_CI_FLAGS in the environment; both are ignored for pnpm and bun.
# swift: product to build (empty = every product); the snapshot/release shim
# also falls back to it when a GoReleaser build names no SWIFT_PRODUCT.
# SWIFT_PRODUCT in the environment overrides per invocation.
swift_product = ""
# terraform: which binary the terraform archetype drives — set to "tofu" in
# an OpenTofu repo (and add the opentofu pin to that repo's root [tools]; the
# shared [tools] only pins terraform). Secrets/env injection is not a knob:
# tf-run.sh always wraps the state-touching tasks and engages fnox only when
# the module directory carries a fnox.toml.
terraform_binary = "terraform"
# container/deploy lint: minimum severity that fails the gate — grype
# --fail-on for Dockerfile base images, kubescape --severity-threshold for
# helm charts and kustomize directories. low|medium|high|critical.
grype_fail_on = "high"
kubescape_severity = "high"
# workflow lint: lowest zizmor finding severity that fails `lint`
# (unknown|informational|low|medium|high). Repos silence accepted findings
# with a zizmor.yml (auto-loaded from the repo root or .github/).
zizmor_min_severity = "low"
# --8<-- [end:vars]
